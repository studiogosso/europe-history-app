<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨーロッパ史 Deep Dive</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛</text></svg>">
<meta name="theme-color" content="#0a0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a16;--bg2:#12122a;--bg3:#1a1a3e;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent3:#4a3fc7;
  --text:#e0e0f0;--text2:#9090b0;
  --gold:#ffd700;--danger:#ff6b6b;--success:#2ecc71;
  --card:rgba(22,22,58,.6);--card-solid:#16163a;
  --border:rgba(255,255,255,.08);--border-hover:rgba(255,255,255,.15);
  --glass:rgba(18,18,42,.65);--glass-border:rgba(255,255,255,.1);
  --radius:14px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --glow:0 0 20px rgba(108,92,231,.15);
}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(108,92,231,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(255,215,0,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--accent3);border-radius:3px}

/* Glass utility */
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border)}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(12,12,30,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:1.3rem;background:linear-gradient(135deg,var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.05em;font-weight:800}
.header-sub{font-size:.7rem;color:var(--text2);margin-top:2px}
.header-right{display:flex;align-items:center;gap:10px}
.header-stats{font-size:.65rem;color:var(--text2);text-align:right;line-height:1.5;display:none}
@media(min-width:600px){.header-stats{display:block}}
.header-actions{display:flex;gap:8px}
.header-actions button{background:rgba(26,26,62,.7);backdrop-filter:blur(10px);border:1px solid var(--glass-border);color:var(--text);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:.8rem;transition:all .25s ease}
.header-actions button:hover,.header-actions button.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(108,92,231,.3)}

/* Navigation */
.nav{display:flex;gap:4px;padding:10px 12px;overflow-x:auto;background:rgba(12,12,30,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border)}
.nav::-webkit-scrollbar{height:0}
.nav button{white-space:nowrap;padding:8px 16px;border:1px solid var(--border);background:var(--card);color:var(--text2);border-radius:22px;cursor:pointer;font-size:.78rem;transition:all .25s ease;flex-shrink:0;backdrop-filter:blur(8px)}
.nav button:hover{border-color:var(--accent);color:var(--text)}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(108,92,231,.3)}
.nav button .badge{display:inline-block;background:rgba(255,255,255,.2);font-size:.6rem;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle}

/* Country Filter */
.country-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:rgba(10,10,22,.6);transition:all .3s ease;max-height:60px;opacity:1}
.country-bar::-webkit-scrollbar{height:0}
.country-bar.hidden{max-height:0;padding:0 12px;opacity:0;overflow:hidden}
.country-bar button{padding:6px 14px;border:1px solid var(--border);background:var(--card);color:var(--text2);border-radius:18px;cursor:pointer;font-size:.72rem;transition:all .25s ease;flex-shrink:0}
.country-bar button:hover{border-color:var(--accent2);color:var(--text)}
.country-bar button.active{background:linear-gradient(135deg,var(--accent3),var(--accent));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(108,92,231,.25)}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:16px;position:relative;z-index:1}
.section{display:none;animation:fadeIn .3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Timeline View */
.timeline{position:relative;padding:20px 0 20px 40px}
.timeline::before{content:'';position:absolute;left:18px;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--accent),var(--accent2),var(--gold));border-radius:2px;opacity:.6}
.tl-item{position:relative;margin-bottom:24px;cursor:pointer;transition:all .25s ease}
.tl-item:hover{transform:translateX(6px)}
.tl-dot{position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);z-index:2;transition:all .25s ease}
.tl-item:hover .tl-dot{background:var(--gold);box-shadow:0 0 16px rgba(255,215,0,.5)}
.tl-item.bookmarked .tl-dot{background:var(--gold);box-shadow:0 0 8px rgba(255,215,0,.3)}
.tl-card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;transition:all .25s ease}
.tl-card:hover{border-color:rgba(108,92,231,.4);box-shadow:var(--shadow),var(--glow)}
.tl-era{font-size:.65rem;color:var(--accent2);margin-bottom:4px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tl-title{font-size:1.05rem;font-weight:700;margin-bottom:6px}
.tl-period{font-size:.75rem;color:var(--gold);margin-bottom:8px}
.tl-desc{font-size:.82rem;color:var(--text2);line-height:1.6}
.tl-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.tl-tag{font-size:.65rem;padding:3px 10px;border-radius:12px;background:rgba(26,26,62,.8);color:var(--accent2);border:1px solid var(--border)}

/* Era Detail Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;justify-content:center;align-items:start;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:rgba(18,18,42,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:16px;max-width:800px;width:100%;padding:28px;position:relative;margin:20px auto;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.modal h2{font-size:1.3rem;margin-bottom:4px;color:var(--accent2)}
.modal .period{font-size:.8rem;color:var(--gold);margin-bottom:16px}
.modal-section{margin-bottom:16px}
.modal-section h3{font-size:.9rem;color:var(--accent);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.modal-section p,.modal-section li{font-size:.84rem;color:var(--text2);line-height:1.7}
.modal-section ul{padding-left:18px}
.modal-section li{margin-bottom:4px}
.causal-box{background:rgba(26,26,62,.6);backdrop-filter:blur(8px);border-left:3px solid var(--gold);padding:14px;border-radius:0 10px 10px 0;margin-top:10px}
.causal-box h4{font-size:.8rem;color:var(--gold);margin-bottom:6px}
.causal-box p{font-size:.8rem;color:var(--text2);line-height:1.6}
.bookmark-btn{background:rgba(26,26,62,.7);backdrop-filter:blur(8px);border:1px solid var(--border);color:var(--text2);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.8rem;margin-top:14px;transition:all .25s ease}
.bookmark-btn:hover{border-color:var(--gold);color:var(--gold)}
.bookmark-btn.active{background:linear-gradient(135deg,var(--gold),#e6c200);color:var(--bg);border-color:transparent;font-weight:600}

/* People Grid */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person-card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .25s ease}
.person-card:hover{border-color:rgba(108,92,231,.4);transform:translateY(-3px);box-shadow:var(--shadow),var(--glow)}
.person-name{font-size:.95rem;font-weight:700;margin-bottom:2px}
.person-name-sub{font-size:.72rem;color:var(--text2);margin-bottom:6px}
.person-life{font-size:.7rem;color:var(--gold);margin-bottom:6px}
.person-role{font-size:.72rem;color:var(--accent2);margin-bottom:8px;display:inline-block;padding:2px 8px;background:rgba(108,92,231,.15);border-radius:8px}
.person-desc{font-size:.78rem;color:var(--text2);line-height:1.5}
.person-countries{display:flex;gap:4px;margin-top:8px}
.person-country{font-size:.6rem;padding:2px 8px;background:rgba(26,26,62,.8);border-radius:8px;color:var(--accent2);border:1px solid var(--border)}

/* Connections */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.conn-card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;transition:all .25s ease}
.conn-card:hover{border-color:rgba(162,155,254,.3);box-shadow:var(--shadow)}
.conn-title{font-size:.9rem;font-weight:700;color:var(--accent2);margin-bottom:6px}
.conn-type{font-size:.68rem;padding:3px 10px;background:linear-gradient(135deg,var(--accent3),var(--accent));color:#fff;border-radius:12px;display:inline-block;margin-bottom:8px}
.conn-desc{font-size:.8rem;color:var(--text2);line-height:1.6}
.conn-eras{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.conn-era{font-size:.65rem;padding:3px 10px;background:rgba(26,26,62,.8);border-radius:12px;color:var(--gold);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.conn-era:hover{border-color:var(--gold);background:rgba(255,215,0,.1)}

/* Quiz */
.quiz-container{max-width:600px;margin:0 auto}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.quiz-score{font-size:.85rem;color:var(--gold);font-weight:600}
.quiz-progress{font-size:.8rem;color:var(--text2)}
.quiz-question{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.quiz-q{font-size:1rem;font-weight:600;margin-bottom:16px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:13px 18px;background:rgba(26,26,62,.6);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.85rem;transition:all .25s ease;text-align:left;color:var(--text)}
.quiz-opt:hover:not(.disabled){border-color:var(--accent);background:rgba(108,92,231,.1)}
.quiz-opt.correct{background:rgba(46,204,113,.15);border-color:var(--success);color:var(--success)}
.quiz-opt.wrong{background:rgba(255,107,107,.15);border-color:var(--danger);color:var(--danger)}
.quiz-opt.disabled{pointer-events:none;opacity:.85}
.quiz-explain{font-size:.82rem;color:var(--text2);margin-top:14px;padding:14px;background:rgba(18,18,42,.7);border-radius:10px;line-height:1.7;display:none;border-left:3px solid var(--accent2)}
.quiz-explain.show{display:block;animation:fadeIn .3s ease}
.quiz-next{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;padding:10px 22px;border-radius:10px;cursor:pointer;font-size:.85rem;margin-top:14px;display:none;transition:all .25s ease}
.quiz-next:hover{box-shadow:0 4px 16px rgba(108,92,231,.4);transform:translateY(-1px)}
.quiz-next.show{display:inline-block}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-result h2{font-size:1.8rem;background:linear-gradient(135deg,var(--gold),#ffed4a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.quiz-result p{color:var(--text2);margin-bottom:12px}
.quiz-restart{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;padding:12px 28px;border-radius:10px;cursor:pointer;font-size:.9rem;transition:all .25s ease}
.quiz-restart:hover{box-shadow:0 4px 16px rgba(108,92,231,.4);transform:translateY(-1px)}

/* Glossary */
.glossary-search{width:100%;padding:12px 18px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-size:.85rem;margin-bottom:16px;outline:none;transition:all .25s ease}
.glossary-search:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(108,92,231,.15)}
.glossary-list{display:flex;flex-direction:column;gap:8px}
.glossary-item{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;transition:all .25s ease}
.glossary-item:hover{border-color:rgba(108,92,231,.3)}
.glossary-term{font-size:.9rem;font-weight:700;color:var(--accent2);margin-bottom:4px}
.glossary-reading{font-size:.7rem;color:var(--text2);margin-bottom:6px;font-style:italic}
.glossary-def{font-size:.8rem;color:var(--text2);line-height:1.6}

/* Bookmarks */
.bookmarks-empty{text-align:center;padding:60px 20px;color:var(--text2)}
.bookmarks-empty .empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.5}
.bm-list{display:flex;flex-direction:column;gap:10px}
.bm-item{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;display:flex;justify-content:space-between;align-items:center;transition:all .25s ease}
.bm-item:hover{border-color:rgba(108,92,231,.3)}
.bm-info{flex:1;cursor:pointer}
.bm-title{font-size:.9rem;font-weight:600}
.bm-type{font-size:.7rem;color:var(--accent2);margin-top:2px}
.bm-remove{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);color:var(--danger);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.75rem;transition:all .2s}
.bm-remove:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

/* Search */
.search-bar{padding:8px 12px;background:rgba(10,10,22,.6);overflow:hidden;transition:all .3s ease;max-height:0;opacity:0}
.search-bar.open{max-height:60px;opacity:1;padding:10px 12px}
.search-input{width:100%;padding:10px 16px;background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-size:.85rem;outline:none;transition:all .25s ease}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(108,92,231,.15)}

/* Scroll to top */
.scroll-top{position:fixed;bottom:20px;right:20px;width:42px;height:42px;background:rgba(108,92,231,.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:12px;cursor:pointer;font-size:1rem;z-index:150;opacity:0;transform:translateY(10px);transition:all .3s ease;display:flex;align-items:center;justify-content:center}
.scroll-top.visible{opacity:1;transform:translateY(0)}
.scroll-top:hover{background:var(--accent);box-shadow:0 4px 16px rgba(108,92,231,.4)}

/* Section count */
.section-count{color:var(--text2);font-size:.8rem;margin-bottom:14px;padding:8px 14px;background:var(--card);backdrop-filter:blur(8px);border-radius:10px;border:1px solid var(--glass-border);display:inline-block}

/* Responsive */
@media(max-width:600px){
  .header{padding:12px 14px}
  .header h1{font-size:1.05rem}
  .header-sub{font-size:.62rem}
  .main{padding:10px}
  .people-grid{grid-template-columns:1fr}
  .conn-grid{grid-template-columns:1fr}
  .modal{padding:18px;margin:10px;border-radius:14px}
  .nav button{padding:7px 13px;font-size:.75rem}
  .country-bar button{padding:5px 12px}
  .quiz-opt{padding:14px 16px;min-height:44px}
  .timeline{padding:16px 0 16px 32px}
  .tl-dot{left:-24px;width:12px;height:12px}
  .timeline::before{left:14px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>ヨーロッパ史 Deep Dive</h1>
    <div class="header-sub">古代ギリシャから現代EUまで ― 政治・文化・社会の因果関係を読む</div>
  </div>
  <div class="header-right">
    <div class="header-stats" id="headerStats"></div>
    <div class="header-actions">
      <button onclick="toggleSearch()" title="検索" id="searchToggle">検索</button>
    </div>
  </div>
</div>

<div class="search-bar" id="searchBar">
  <input class="search-input" id="globalSearch" placeholder="キーワードで全体を検索..." oninput="handleGlobalSearch(this.value)">
</div>

<nav class="nav" id="mainNav">
  <button class="active" data-tab="timeline">年表</button>
  <button data-tab="eras">時代カード</button>
  <button data-tab="people">人物 <span class="badge">63</span></button>
  <button data-tab="connections">因果関係</button>
  <button data-tab="quiz">クイズ</button>
  <button data-tab="glossary">用語集</button>
  <button data-tab="bookmarks">ブックマーク <span class="badge" id="bmBadge">0</span></button>
</nav>

<div class="country-bar" id="countryBar">
  <button class="active" data-country="all">全て</button>
  <button data-country="france">フランス</button>
  <button data-country="germany">ドイツ</button>
  <button data-country="britain">イギリス</button>
  <button data-country="italy">イタリア</button>
  <button data-country="spain">スペイン</button>
  <button data-country="russia">ロシア</button>
  <button data-country="greece">ギリシャ</button>
  <button data-country="rome">ローマ</button>
</div>

<main class="main">
  <div class="section active" id="sec-timeline"></div>
  <div class="section" id="sec-eras"></div>
  <div class="section" id="sec-people"></div>
  <div class="section" id="sec-connections"></div>
  <div class="section" id="sec-quiz"></div>
  <div class="section" id="sec-glossary"></div>
  <div class="section" id="sec-bookmarks"></div>
</main>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="ページ上部へ">&#9650;</button>

<script>
// ============================================================
// DATA
// ============================================================
const ERAS = [
  {
    id:"ancient-greece",period:"800-146 BC",title:"古代ギリシャ",
    countries:["greece"],
    tags:["ポリス","民主制","哲学","オリンピック"],
    summary:"ポリス（都市国家）を基盤とし、民主制・哲学・芸術が花開いた文明の源泉。",
    politics:"各ポリスが独自の政治体制を持つ。アテナイは直接民主制、スパルタは二王制と寡頭制。ペルシャ戦争（前490-449）で団結するも、ペロポネソス戦争（前431-404）で内部分裂。最終的にマケドニアのフィリッポス2世に統合される。",
    events:["ソロンの改革 (前594)","ペルシャ戦争 (前490-449)","ペリクレス時代 (前461-429)","ペロポネソス戦争 (前431-404)","アレクサンドロス東方遠征 (前334-323)"],
    figures:["ペリクレス","ソクラテス","プラトン","アリストテレス","アレクサンドロス大王","ヘロドトス"],
    culture:"哲学（ソクラテス・プラトン・アリストテレス）、悲劇（ソポクレス）、建築（パルテノン）、歴史学（ヘロドトス・トゥキュディデス）。ギリシャ哲学は西洋思想の根幹を形成。",

// ============================================================
// STATE
// ============================================================
let currentTab = 'timeline';
let currentCountry = 'all';
let bookmarks = JSON.parse(localStorage.getItem('eu-hist-bookmarks') || '[]');
let quizState = {current:0, score:0, answered:false, finished:false};
let shuffledQuiz = [];

// Tabs where country filter is relevant
const countryTabs = ['timeline','eras','people','connections'];

// ============================================================
// NAVIGATION
// ============================================================
document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('sec-' + currentTab).classList.add('active');
    // Show/hide country bar based on tab
    const countryBar = document.getElementById('countryBar');
    if(countryTabs.includes(currentTab)) {
      countryBar.classList.remove('hidden');
    } else {
      countryBar.classList.add('hidden');
    }
    if(currentTab === 'quiz' && !quizState.finished && shuffledQuiz.length === 0) startQuiz();
    if(currentTab === 'bookmarks') renderBookmarks();
    // Scroll to top on tab change
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

document.querySelectorAll('.country-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.country-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCountry = btn.dataset.country;
    renderAll();
  });
});

// Search toggle with animation
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const btn = document.getElementById('searchToggle');
  if(bar.classList.contains('open')) {
    bar.classList.remove('open');
    btn.classList.remove('active');
    document.getElementById('globalSearch').value = '';
    renderAll();
  } else {
    bar.classList.add('open');
    btn.classList.add('active');
    setTimeout(() => document.getElementById('globalSearch').focus(), 150);
  }
}

function handleGlobalSearch(val) {
  if(!val.trim()) { renderAll(); return; }
  renderTimeline(val);
  renderEras(val);
  renderPeople(val);
  renderConnections(val);
  renderGlossary(val);
}

// Scroll to top button
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTop');
  if(window.scrollY > 300) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
});

// ============================================================
// FILTER
// ============================================================
function filterByCountry(items) {
  if(currentCountry === 'all') return items;
  return items.filter(i => i.countries && i.countries.includes(currentCountry));
}

function filterBySearch(items, search, fields) {
  if(!search) return items;
  const s = search.toLowerCase();
  return items.filter(i => fields.some(f => {
    const val = i[f];
    if(Array.isArray(val)) return val.some(v => v.toLowerCase().includes(s));
    return val && val.toLowerCase().includes(s);
  }));
}

// ============================================================
// RENDER: TIMELINE
// ============================================================
function renderTimeline(search) {
  let eras = filterByCountry(ERAS);
  if(search) eras = filterBySearch(eras, search, ['title','summary','tags','period']);
  const container = document.getElementById('sec-timeline');
  if(eras.length === 0) { container.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">該当する時代がありません</p>'; return; }
  container.innerHTML = '<div class="timeline">' + eras.map(era => {
    const isBookmarked = bookmarks.some(b => b.id === era.id && b.type === 'era');
    return `<div class="tl-item ${isBookmarked ? 'bookmarked' : ''}" onclick="openEraModal('${era.id}')">
      <div class="tl-dot"></div>
      <div class="tl-card">
        <div class="tl-era">ERA</div>
        <div class="tl-title">${era.title}</div>
        <div class="tl-period">${era.period}</div>
        <div class="tl-desc">${era.summary}</div>
        <div class="tl-tags">${era.tags.map(t => `<span class="tl-tag">${t}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('') + '</div>';
}

// ============================================================
// RENDER: ERA CARDS
// ============================================================
function renderEras(search) {
  let eras = filterByCountry(ERAS);
  if(search) eras = filterBySearch(eras, search, ['title','summary','tags','period']);
  const container = document.getElementById('sec-eras');
  if(eras.length === 0) { container.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">該当する時代がありません</p>'; return; }
  container.innerHTML = `<div class="section-count">${eras.length}つの時代</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">` +
    eras.map(era => `<div class="tl-card" style="cursor:pointer" onclick="openEraModal('${era.id}')">
      <div class="tl-era">${era.period}</div>
      <div class="tl-title">${era.title}</div>
      <div class="tl-desc">${era.summary}</div>
      <div class="tl-tags" style="margin-top:8px">${era.tags.map(t => `<span class="tl-tag">${t}</span>`).join('')}</div>
    </div>`).join('') + '</div>';
}

      <p>${era.causeBefore}</p>
    </div>
    <div class="causal-box" style="margin-top:8px;border-left-color:var(--accent)">
      <h4>→ 次の時代への因果</h4>
      <p>${era.causeAfter}</p>
    </div>
    <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${era.id}','era','${era.title}')">
      ${isBookmarked ? '★ ブックマーク済み' : '☆ ブックマークに追加'}
    </button>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
// RENDER: PEOPLE
// ============================================================
function renderPeople(search) {
  let people = filterByCountry(PEOPLE);
  if(search) people = filterBySearch(people, search, ['name','sub','role','desc','era']);
  const container = document.getElementById('sec-people');
  if(people.length === 0) { container.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">該当する人物がいません</p>'; return; }
  container.innerHTML = `<div class="section-count">${people.length}人の人物</div>
    <div class="people-grid">${people.map(p => `<div class="person-card" onclick="openPersonModal('${p.name}')">
      <div class="person-name">${p.name}</div>
      <div class="person-name-sub">${p.sub}</div>
      <div class="person-life">${p.life}</div>
      <div class="person-role">${p.role}</div>
      <div class="person-desc">${p.desc.substring(0, 60)}...</div>
      <div class="person-countries">${p.countries.map(c => `<span class="person-country">${countryLabel(c)}</span>`).join('')}</div>
    </div>`).join('')}</div>`;
}

function countryLabel(c) {
  const map = {france:'フランス',germany:'ドイツ',britain:'イギリス',italy:'イタリア',spain:'スペイン',russia:'ロシア',greece:'ギリシャ',rome:'ローマ'};
  return map[c] || c;
}

function openPersonModal(name) {
  const p = PEOPLE.find(x => x.name === name);
  if(!p) return;
  const eraObj = ERAS.find(e => e.id === p.era);
  const isBookmarked = bookmarks.some(b => b.id === p.name && b.type === 'person');
  // Find related people from the same era
  const related = PEOPLE.filter(x => x.era === p.era && x.name !== p.name).slice(0, 4);
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2>${p.name}</h2>
    <div style="font-size:.85rem;color:var(--text2);margin-bottom:4px">${p.sub}</div>
    <div class="period">${p.life}</div>
    <div class="modal-section">
      <h3>${p.role}</h3>
      <p>${p.desc}</p>
    </div>
    <div class="modal-section">
      <h3>時代</h3>
      <p style="cursor:pointer;color:var(--accent2)" onclick="closeModal();setTimeout(()=>openEraModal('${p.era}'),200)">${eraObj ? eraObj.title + ' (' + eraObj.period + ')' : p.era}</p>
    </div>
    <div class="modal-section">
      <h3>関連国</h3>
      <p>${p.countries.map(c => countryLabel(c)).join('、')}</p>
    </div>
    ${related.length > 0 ? `<div class="modal-section">
      <h3>同時代の人物</h3>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${related.map(r =>
        `<span style="cursor:pointer;font-size:.78rem;padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--accent2);transition:all .2s" onclick="closeModal();setTimeout(()=>openPersonModal('${r.name}'),200)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">${r.name}</span>`
      ).join('')}</div>
    </div>` : ''}
    <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${p.name}','person','${p.name}')">
      ${isBookmarked ? '★ ブックマーク済み' : '☆ ブックマークに追加'}
    </button>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// ============================================================
// RENDER: CONNECTIONS
// ============================================================
function renderConnections(search) {
  let conns = CONNECTIONS;
  if(search) conns = conns.filter(c => {
    const s = search.toLowerCase();
    return c.title.toLowerCase().includes(s) || c.desc.toLowerCase().includes(s) || c.type.toLowerCase().includes(s);
  });
  const container = document.getElementById('sec-connections');
  if(conns.length === 0) { container.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">該当する因果関係がありません</p>'; return; }
  container.innerHTML = `<div class="section-count">時代を超えた因果関係・テーマ別つながり (${conns.length}件)</div>
    <div class="conn-grid">${conns.map(c => `<div class="conn-card">
      <div class="conn-title">${c.title}</div>
      <span class="conn-type">${c.type}</span>
      <div class="conn-desc">${c.desc}</div>
      <div class="conn-eras">${c.eras.map(e => {const era = ERAS.find(x=>x.id===e); return `<span class="conn-era" onclick="openEraModal('${e}')">${era?era.title:e}</span>`;}).join('')}</div>
    </div>`).join('')}</div>`;
}

// ============================================================
// QUIZ
// ============================================================
function startQuiz() {
  shuffledQuiz = [...QUIZ_QUESTIONS].sort(() => Math.random() - 0.5);
  quizState = {current: 0, score: 0, answered: false, finished: false};
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('sec-quiz');
  if(quizState.finished) {
    const pct = Math.round(quizState.score / shuffledQuiz.length * 100);
    let msg, grade;
    if(pct >= 90) { msg = '素晴らしい！ヨーロッパ史マスター！'; grade = 'S'; }
    else if(pct >= 80) { msg = '優秀です！あと少しで完璧！'; grade = 'A'; }
    else if(pct >= 60) { msg = 'よくできました。復習でさらに伸ばしましょう。'; grade = 'B'; }
    else if(pct >= 40) { msg = 'まずまずです。苦手な時代を重点的に復習しましょう。'; grade = 'C'; }
    else { msg = 'もう一度挑戦して理解を深めましょう。'; grade = 'D'; }
    container.innerHTML = `<div class="quiz-container"><div class="quiz-result">
      <div style="font-size:3rem;margin-bottom:8px;opacity:.8">${grade}</div>
      <h2>${pct}% 正解</h2>
      <p style="font-size:1.1rem">${quizState.score} / ${shuffledQuiz.length} 問正解</p>
      <p style="margin-bottom:24px;color:var(--text2)">${msg}</p>
      <button class="quiz-restart" onclick="startQuiz()">もう一度挑戦</button>
    </div></div>`;
    return;
  }
  const q = shuffledQuiz[quizState.current];
  container.innerHTML = `<div class="quiz-container">
    <div class="quiz-header">
      <div class="quiz-progress">問題 ${quizState.current + 1} / ${shuffledQuiz.length}</div>
      <div class="quiz-score">正解: ${quizState.score}</div>
    </div>
    <div style="height:4px;background:rgba(26,26,62,.8);border-radius:2px;margin-bottom:16px;overflow:hidden">
      <div style="height:100%;width:${(quizState.current/shuffledQuiz.length)*100}%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:.4s ease"></div>
    </div>
    <div class="quiz-question">
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">${q.opts.map((opt, i) => `<button class="quiz-opt" onclick="answerQuiz(${i})" id="qopt${i}">${opt}</button>`).join('')}</div>
      <div class="quiz-explain" id="quizExplain">${q.explain}</div>
      <button class="quiz-next" id="quizNext" onclick="nextQuiz()">次の問題 →</button>
    </div>
  </div>`;
}

function answerQuiz(idx) {
  if(quizState.answered) return;
  quizState.answered = true;
  const q = shuffledQuiz[quizState.current];
  document.querySelectorAll('.quiz-opt').forEach(b => b.classList.add('disabled'));
  if(idx === q.ans) {
    document.getElementById('qopt' + idx).classList.add('correct');
    quizState.score++;
  } else {
    document.getElementById('qopt' + idx).classList.add('wrong');
    document.getElementById('qopt' + q.ans).classList.add('correct');
  }
  document.getElementById('quizExplain').classList.add('show');
  document.getElementById('quizNext').classList.add('show');
}

function nextQuiz() {
  quizState.current++;
  quizState.answered = false;
  if(quizState.current >= shuffledQuiz.length) {
    quizState.finished = true;
  }
  renderQuiz();
}

// ============================================================
// GLOSSARY
// ============================================================
function renderGlossary(search) {
  const container = document.getElementById('sec-glossary');
  const items = search ? GLOSSARY.filter(g => {
    const s = search.toLowerCase();
    return g.term.toLowerCase().includes(s) || g.reading.toLowerCase().includes(s) || g.def.toLowerCase().includes(s);
  }) : GLOSSARY;
  container.innerHTML = `<input class="glossary-search" placeholder="用語を検索..." oninput="filterGlossary(this.value)" value="${search||''}">
    <div class="section-count">${items.length}件の用語</div>
    <div class="glossary-list" id="glossaryList">${renderGlossaryItems(items)}</div>`;
}

function renderGlossaryItems(items) {
  if(items.length === 0) return '<p style="text-align:center;color:var(--text2);padding:20px">該当する用語がありません</p>';
  return items.map(g => `<div class="glossary-item">
    <div class="glossary-term">${g.term}</div>
    <div class="glossary-reading">${g.reading}</div>
    <div class="glossary-def">${g.def}</div>
  </div>`).join('');
}

function filterGlossary(val) {
  const s = val.toLowerCase();
  const filtered = s ? GLOSSARY.filter(g => g.term.toLowerCase().includes(s) || g.reading.toLowerCase().includes(s) || g.def.toLowerCase().includes(s)) : GLOSSARY;
  document.getElementById('glossaryList').innerHTML = renderGlossaryItems(filtered);
}

// ============================================================
// BOOKMARKS
// ============================================================
function toggleBookmark(id, type, title) {
  const idx = bookmarks.findIndex(b => b.id === id && b.type === type);
  if(idx >= 0) {
    bookmarks.splice(idx, 1);
  } else {
    bookmarks.push({id, type, title});
  }
  localStorage.setItem('eu-hist-bookmarks', JSON.stringify(bookmarks));
  updateBmBadge();
  renderAll();
  // Re-open modal with updated state
  if(type === 'era') openEraModal(id);
  else if(type === 'person') openPersonModal(id);
}

function renderBookmarks() {
  const container = document.getElementById('sec-bookmarks');
  if(bookmarks.length === 0) {
    container.innerHTML = '<div class="bookmarks-empty"><div class="empty-icon">☆</div><p>ブックマークはまだありません</p><p style="font-size:.8rem;margin-top:8px">時代や人物をブックマークに追加してみましょう</p></div>';
    return;
  }
  container.innerHTML = `<div class="section-count">${bookmarks.length}件のブックマーク</div>
    <div class="bm-list">${bookmarks.map((b, i) => `<div class="bm-item">
      <div class="bm-info" onclick="${b.type === 'era' ? `openEraModal('${b.id}')` : `openPersonModal('${b.id}')`}">
        <div class="bm-title">${b.title}</div>
        <div class="bm-type">${b.type === 'era' ? '時代' : '人物'}</div>
      </div>
      <button class="bm-remove" onclick="removeBookmark(${i})">削除</button>
    </div>`).join('')}</div>`;
}

function removeBookmark(idx) {
  bookmarks.splice(idx, 1);
  localStorage.setItem('eu-hist-bookmarks', JSON.stringify(bookmarks));
  updateBmBadge();
  renderBookmarks();
}

function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if(badge) badge.textContent = bookmarks.length;
}

// ============================================================
// HEADER STATS
// ============================================================
function updateHeaderStats() {
  const el = document.getElementById('headerStats');
  if(el) el.innerHTML = `${ERAS.length}時代 / ${PEOPLE.length}人物 / ${QUIZ_QUESTIONS.length}問`;
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  renderTimeline();
  renderEras();
  renderPeople();
  renderConnections();
  renderGlossary();
}

// Keyboard
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  // Ctrl+K for search
  if((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    toggleSearch();
  }
});

// Init
renderAll();
updateBmBadge();
updateHeaderStats();

// ============================================================
// PWA Service Worker Registration
// ============================================================
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
